<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    EpicWorks — Modular Static Site
    index.html = shell / assembler only

    Responsibilities:
    - Global layout
    - Navigation
    - Section composition via iframes
    - Accessibility fallbacks
  -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>EpicWorks — Systems that think.</title>
  <meta
    name="description"
    content="EpicWorks builds secure, local-first AI infrastructure for teams, schools, startups, and advanced individuals."
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo.png" />
</head>

<body>

  <!-- =====================================================
       Accessibility: Skip to content
       ===================================================== -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- =====================================================
       Header / Navigation
       ===================================================== -->
  <header class="site-header" id="top">
    <div class="container header__inner">

      <a href="#top" class="brand" aria-label="EpicWorks home">
        <img src="assets/logo.png" alt="EpicWorks logo" class="brand__logo" />
        <span class="brand__name">EpicWorks</span>
      </a>

      <!-- Desktop navigation (iframe-aware) -->
      <nav class="nav" aria-label="Primary navigation">
        <a class="nav__link" href="#section-about" class="nav__link">About</a>
        <a class="nav__link" href="#section-offerings" class="nav__link">Offerings</a>
        <a class="nav__link" href="#section-methodology" class="nav__link">Methodology</a>
        <a class="nav__cta" href="#section-engagement">Get in touch</a>
      </nav>

      <!-- Mobile fallback CTA -->
      <a class="nav__cta nav__cta--mobile" href="#" data-scroll="section-engagement">
        Contact
      </a>

    </div>
  </header>

  <!-- =====================================================
       No-JS fallback
       ===================================================== -->
  <noscript>
    <div class="container" style="padding: 2rem 0;">
      <p>
        This site is built with modular sections.
        JavaScript is only used for navigation and layout polish.
      </p>
      <p>
        If you are seeing this message, please use the direct section pages:
      </p>
      <ul>
        <li><a href="sections/hero.html">Hero</a></li>
        <li><a href="sections/about.html">About</a></li>
        <li><a href="sections/offerings.html">Offerings</a></li>
        <li><a href="sections/methodology.html">Methodology</a></li>
        <li><a href="sections/engagement.html">Contact</a></li>
      </ul>
    </div>
  </noscript>

  <!-- =====================================================
       Main Content
       ===================================================== -->
  <main id="main">

    <!-- HERO -->
    <iframe
      id="section-hero"
      src="sections/hero.html"
      class="section-frame"
      loading="eager"
      title="EpicWorks introduction"
      aria-label="EpicWorks hero section"
    ></iframe>

    <!-- ABOUT -->
    <iframe
      id="section-about"
      src="sections/about.html"
      class="section-frame"
      loading="lazy"
      title="About EpicWorks"
      aria-label="About EpicWorks"
    ></iframe>

    <!-- OFFERINGS -->
    <iframe
      id="section-offerings"
      src="sections/offerings.html"
      class="section-frame"
      loading="lazy"
      title="EpicWorks offerings"
      aria-label="EpicWorks offerings"
    ></iframe>

    <!-- METHODOLOGY -->
    <iframe
      id="section-methodology"
      src="sections/methodology.html"
      class="section-frame"
      loading="lazy"
      title="EpicWorks methodology"
      aria-label="EpicWorks methodology"
    ></iframe>

    <!-- ENGAGEMENT -->
    <iframe
      id="section-engagement"
      src="sections/engagement.html"
      class="section-frame"
      loading="lazy"
      title="Contact EpicWorks"
      aria-label="Contact EpicWorks"
    ></iframe>

  </main>

  <!-- =====================================================
       Footer
       ===================================================== -->
  <footer class="site-footer">
    <div class="container footer__inner">

      <div>
        <img src="assets/logo.png" alt="EpicWorks logo" class="brand__logo" />
        <p class="footer__tagline">
          Systems that think.<br />
          Secure, local-first AI infrastructure.
        </p>
      </div>

      <!-- Footer navigation (iframe-aware) -->
      <nav class="footer__nav" aria-label="Footer navigation">
        <a href="#" data-scroll="section-about">About</a>
        <a href="#" data-scroll="section-offerings">Offerings</a>
        <a href="#" data-scroll="section-methodology">Methodology</a>
        <a href="#" data-scroll="section-engagement">Contact</a>
      </nav>

    </div>

    <div class="footer__bottom">
      <span>© 2026 EpicWorks</span>
      <span class="footer__separator">•</span>
      <span>Built for Cloudflare Pages</span>
    </div>
  </footer>

  <!-- =====================================================
       Optional JS (isolated, layout + navigation only)
       ===================================================== -->
  <script src="js/iframe-resize.js"></script>
  <script src="js/iframe-nav.js"></script>

</body>
</html>
