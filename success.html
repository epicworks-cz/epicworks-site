<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message Sent — EpicWorks</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: #141414;
      background: #fbfbfa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      margin: 0 0 20px;
      color: #1f3a5f;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #4b4b4b;
      margin: 0 0 30px;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #1f3a5f;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✓ Message sent!</h1>
    <p>Thank you for reaching out. We've received your message and will get back to you soon.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
