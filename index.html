<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    EpicWorks — Modular Static Site
    index.html = shell / assembler only
    Sections loaded via iframe (static-safe)
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>EpicWorks — Systems that think.</title>
  <meta
    name="description"
    content="EpicWorks builds secure, local-first AI infrastructure for teams, schools, startups, and advanced individuals."
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo.png" />
</head>

<body>

  <!-- =====================================================
       Accessibility: Skip to content
       ===================================================== -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- =====================================================
       Header / Navigation
       ===================================================== -->
  <header class="site-header" id="top">
    <div class="container header__inner">

      <a href="#top" class="brand" aria-label="EpicWorks home">
        <img src="assets/logo.png" alt="EpicWorks logo" class="brand__logo" />
        <span class="brand__name">EpicWorks</span>
      </a>

      <!-- Desktop nav -->
      <nav class="nav" aria-label="Primary navigation">
        <a class="nav__link" href="#about">About</a>
        <a class="nav__link" href="#offerings">Offerings</a>
        <a class="nav__link" href="#methodology">Methodology</a>
        <a class="nav__cta" href="#engagement">Get in touch</a>
      </nav>

      <!-- Mobile fallback CTA (no JS menu) -->
      <a class="nav__cta nav__cta--mobile" href="#engagement">
        Contact
      </a>

    </div>
  </header>

  <!-- =====================================================
       Main Content
       ===================================================== -->
  <main id="main">

    <!-- HERO -->
    <iframe
      src="sections/hero.html"
      title="EpicWorks hero"
      class="section-frame"
      loading="eager"
    ></iframe>

    <!-- ABOUT -->
    <iframe
      src="sections/about.html"
      title="About EpicWorks"
      class="section-frame"
      loading="lazy"
    ></iframe>

    <!-- OFFERINGS -->
    <iframe
      src="sections/offerings.html"
      title="EpicWorks offerings"
      class="section-frame"
      loading="lazy"
    ></iframe>

    <!-- METHODOLOGY -->
    <iframe
      src="sections/methodology.html"
      title="EpicWorks methodology"
      class="section-frame"
      loading="lazy"
    ></iframe>

    <!-- ENGAGEMENT -->
    <iframe
      src="sections/engagement.html"
      title="Contact EpicWorks"
      class="section-frame"
      loading="lazy"
    ></iframe>

  </main>

  <!-- =====================================================
       Footer
       ===================================================== -->
  <footer class="site-footer">
    <div class="container footer__inner">

      <div>
        <img src="assets/logo.png" alt="EpicWorks logo" class="brand__logo" />
        <p class="footer__tagline">
          Systems that think.<br />
          Secure, local-first AI infrastructure.
        </p>
      </div>

      <nav class="footer__nav" aria-label="Footer navigation">
        <a href="#about">About</a>
        <a href="#offerings">Offerings</a>
        <a href="#methodology">Methodology</a>
        <a href="#engagement">Contact</a>
      </nav>

    </div>

    <div class="footer__bottom">
      <span>© 2026 EpicWorks</span>
      <span class="footer__separator">•</span>
      <span>Built for Cloudflare Pages</span>
    </div>
  </footer>
<script src="js/iframe-resize.js"></script>
</body>
</html>
<!-- =====================================================
     END INDEX.HTML
     ===================================================== -->
